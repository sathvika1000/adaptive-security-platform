name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev,evtx]'
      - run: ruff check .
      - run: mypy src
      - run: pytest --cov=adaptive_security --cov-report=term-missing --cov-fail-under=80
      - run: docker build -t adaptive-security-platform:test .
      - name: Validate Wazuh Compose integration
        env:
          ASP_API_KEY: ci-only-key
        run: |
          docker compose -f compose.yaml -f compose.wazuh.yaml config --quiet
          git clone --quiet --depth 1 --branch v4.14.8 \
            https://github.com/wazuh/wazuh-docker.git /tmp/asp-wazuh-docker
          docker compose -p asp-wazuh \
            -f /tmp/asp-wazuh-docker/single-node/docker-compose.yml \
            -f deploy/wazuh-loopback.yaml config --quiet

  windows-export:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[evtx]"
      - name: Check native Windows Security capture export
        shell: powershell
        run: ./scripts/test_windows_validation_export.ps1

  browser-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: python -m pip install -e '.[dev,evtx]'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: browser-review-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
