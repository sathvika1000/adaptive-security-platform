# Overlay for wazuh-docker v4.14.8 single-node. Compose 2.24.4+ is required.
services:
  wazuh.manager:
    ports: !override
      - "127.0.0.1:1514:1514"
      - "127.0.0.1:1515:1515"
      - "127.0.0.1:55000:55000"
  wazuh.indexer:
    ports: !override []
  wazuh.dashboard:
    ports: !override
      - "127.0.0.1:8443:5601"
